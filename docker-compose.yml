services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hadeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: hadeed
    volumes:
      - hadeed-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hadeed -d hadeed']
      interval: 10s
      timeout: 5s
      retries: 5

  hadeed:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://hadeed:${POSTGRES_PASSWORD}@db:5432/hadeed?sslmode=disable
      # لازم تعبّيهم في ملف .env جنب هذا الملف:
      #   POSTGRES_PASSWORD=...
      #   SESSION_SECRET=...  (ولّده: node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))")
      #   ORIGIN=https://your-domain.example
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ORIGIN: ${ORIGIN:?ORIGIN is required}
      # فعّله لو خلف Nginx/Caddy/Cloudflare — وإلا خلّه 0.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # اقفله (0) بعد ما تسوي حسابك.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}

volumes:
  hadeed-db:
