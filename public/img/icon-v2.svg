<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="حديد">
  <defs>
    <!-- The lime light the app's own background carries, so the icon belongs
         to the same family as the screens rather than to a palette of its own.
         Tight on purpose: a smooth gradient across the whole 512px plate came
         to 16,000 distinct colours and 192 KB of PNG, and at the 60px this is
         actually seen at, none of that spread was visible. The screens carry a
         second, teal light; at icon size it read as nothing at all. -->
    <radialGradient id="lime" cx="0.8" cy="0.04" r="0.4">
      <stop offset="0" stop-color="#C4FF36" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C4FF36" stop-opacity="0"/>
    </radialGradient>
    <!-- The specular edge along the top, which is what reads as glass. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9FF6E"/>
      <stop offset="1" stop-color="#A8EC1F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#12150D"/>
  <rect width="512" height="512" rx="112" fill="url(#lime)"/>
  <path d="M0 112A112 112 0 0 1 112 0h288a112 112 0 0 1 112 112v96C512 150 380 108 256 108S0 150 0 208z" fill="url(#sheen)"/>
  <!-- The barbell itself is untouched: same five bars, same centre, as the
       icon this replaces. Only the plate under it changed. -->
  <g fill="url(#bar)">
    <rect x="72"  y="206" width="46"  height="100" rx="18"/>
    <rect x="126" y="176" width="58"  height="160" rx="24"/>
    <rect x="184" y="234" width="144" height="44"  rx="18"/>
    <rect x="328" y="176" width="58"  height="160" rx="24"/>
    <rect x="394" y="206" width="46"  height="100" rx="18"/>
  </g>
  <circle cx="256" cy="256" r="19" fill="#4EE39A"/>
</svg>
