<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no was removed on purpose: blocking pinch-zoom fails
         WCAG 1.4.4 and makes the app unusable for anyone who needs to zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1109" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="سجل تمرين حديد — برنامج تمرين وتغذية مع مزامنة بين الأجهزة." />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حديد" />
    <title>حديد — سجل التمرين</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/icon-180.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>

    <!-- ══════ GYM MODE ══════ -->
    <div id="gym" role="dialog" aria-modal="true" aria-label="وضع التمرين" hidden>
      <div class="gtop">
        <button class="x" id="gx" aria-label="إغلاق وضع التمرين">✕</button>
        <span class="gcount" id="gcount"></span>
      </div>
      <div class="gdots" id="gdots" aria-hidden="true"></div>
      <div class="gbody" id="gbody"></div>
      <div class="gfoot" id="gfoot"></div>
    </div>

    <div id="restbar" aria-hidden="true"></div>
    <div id="rest" role="dialog" aria-modal="true" aria-label="مؤقّت الراحة" hidden>
      <div class="fr" aria-hidden="true"></div>
      <div class="lb">راحة</div>
      <div class="tm n" id="rtm" role="timer" aria-live="off">1:30</div>
      <div class="nx" id="rnx"></div>
      <div class="btns">
        <button id="radd">+30 ثانية</button>
        <button id="rskip">تخطّي</button>
      </div>
    </div>

    <div id="fin" role="dialog" aria-modal="true" aria-label="نهاية التمرين" hidden>
      <div class="tick" aria-hidden="true">✓</div>
      <h2>خلّصت</h2>
      <p id="finp"></p>
      <div class="stats" id="finstats"></div>
      <button class="cta max" id="finx">تمام</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ══════ bottom navigation ══════ -->
    <nav id="tabbar" aria-label="التنقّل الرئيسي">
      <button class="tab" type="button" data-view="home" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 11.2 12 4.4l8.4 6.8V19a1.4 1.4 0 0 1-1.4 1.4H5A1.4 1.4 0 0 1 3.6 19z" /><path d="M9.8 20.4v-5.2h4.4v5.2" /></svg>
        <span>الرئيسية</span>
      </button>
      <button class="tab" type="button" data-view="cardio" aria-label="الكارديو">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3C7.2 17 4.3 14.2 4.3 11.2A4 4 0 0 1 12 9.6a4 4 0 0 1 7.7 1.6c0 3-2.9 5.8-7.7 9.1z" /><path d="M6.4 12.9h2.2l1.1-2 1.7 3.8 1.3-2.5.9.7h3.9" /></svg>
        <span>الكارديو</span>
      </button>
      <button class="tab" type="button" data-view="nutri" aria-label="السعرات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" /><path d="M12 7.6c1.8 1.8 2.4 3 2.4 4.7a2.4 2.4 0 0 1-4.8 0c0-.6.2-1.2.6-1.6.4 1 1.3.4 1.8-3.1z" /></svg>
        <span>السعرات</span>
      </button>
      <button class="tab" type="button" data-view="week" aria-label="القياس">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8v3.4M4.6 7.4h14.8M7.1 7.8 4.4 14a3.4 3.4 0 0 0 5.4 0zM16.9 7.8 14.2 14a3.4 3.4 0 0 0 5.4 0zM8.9 20.3h6.2" /></svg>
        <span>القياس</span>
      </button>
      <button class="tab" type="button" data-view="account" aria-label="الحساب">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" /><circle cx="12" cy="10" r="2.7" /><path d="M6.9 18.8a5.6 5.6 0 0 1 10.2 0" /></svg>
        <span>الحساب</span>
      </button>
    </nav>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
